name: Check video library

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tooling:
    name: Tooling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Check Python and build recipes
        run: python 3rd/check.py
      - name: Test source validation and SDK publication
        run: python -B -m unittest discover -s 3rd/tests -v
      - name: Verify installed SDK integrity
        run: python 3rd/sdk.py audit
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: false
      - name: Test without cgo
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - name: Set up Windows compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-python
      - name: Test native library and race boundaries (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python scripts/check.py --link --race
      - name: Test native library and race boundaries (Unix)
        if: runner.os != 'Windows'
        run: python scripts/check.py --link --race
